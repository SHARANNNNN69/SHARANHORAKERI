<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tvaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="spiderGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0c0f17" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="24" fill="#0c0f17"/>
  <circle cx="50" cy="50" r="40" fill="url(#spiderGlow)"/>
  
  <!-- Subtle Web grid -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#253047" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="50" cy="50" r="20" fill="none" stroke="#ff7b00" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="50" y1="18" x2="50" y2="82" stroke="#253047" stroke-width="1.5"/>
  <line x1="18" y1="50" x2="82" y2="50" stroke="#253047" stroke-width="1.5"/>
  <line x1="27" y1="27" x2="73" y2="73" stroke="#253047" stroke-width="1.5"/>
  <line x1="27" y1="73" x2="73" y2="27" stroke="#253047" stroke-width="1.5"/>

  <!-- Hourglass / Multiverse TVA Loom Node -->
  <polygon points="50,28 66,50 50,72 34,50" fill="url(#tvaGrad)" opacity="0.95"/>
  <circle cx="50" cy="50" r="4" fill="#ffffff"/>
  <circle cx="50" cy="50" r="1.5" fill="#0c0f17"/>
</svg>

