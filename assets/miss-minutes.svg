<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="mmOrange" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ff9142"/>
      <stop offset="70%" stop-color="#ff6000"/>
      <stop offset="100%" stop-color="#d64400"/>
    </radialGradient>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a1"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c6d1a"/>
    </linearGradient>
    <filter id="retroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#retroShadow)">
    <!-- Retro Analog Clock Body -->
    <!-- Gold Rim -->
    <circle cx="100" cy="100" r="76" fill="url(#metalRim)" stroke="#3e2a05" stroke-width="4"/>
    <!-- Orange Clock Face -->
    <circle cx="100" cy="100" r="68" fill="url(#mmOrange)" stroke="#2b1400" stroke-width="3"/>

    <!-- Clock Tick Marks -->
    <line x1="100" y1="36" x2="100" y2="44" stroke="#ffe8a1" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="164" x2="100" y2="156" stroke="#ffe8a1" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="100" x2="44" y2="100" stroke="#ffe8a1" stroke-width="3" stroke-linecap="round"/>
    <line x1="164" y1="100" x2="156" y2="100" stroke="#ffe8a1" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Big Vintage Cartoon Eyes -->
    <!-- Left Eye Outer -->
    <ellipse cx="78" cy="85" rx="16" ry="24" fill="#ffffff" stroke="#2b1400" stroke-width="3"/>
    <!-- Right Eye Outer -->
    <ellipse cx="122" cy="85" rx="16" ry="24" fill="#ffffff" stroke="#2b1400" stroke-width="3"/>
    <!-- Eye Highlights & Pupils -->
    <ellipse cx="82" cy="86" rx="8" ry="13" fill="#1c1106"/>
    <circle cx="80" cy="81" r="3.5" fill="#ffffff"/>
    <ellipse cx="118" cy="86" rx="8" ry="13" fill="#1c1106"/>
    <circle cx="116" cy="81" r="3.5" fill="#ffffff"/>

    <!-- Cute Eyelashes -->
    <path d="M 64 68 Q 60 62 58 56" stroke="#2b1400" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 72 63 Q 71 55 69 48" stroke="#2b1400" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 82 63 Q 86 56 89 50" stroke="#2b1400" stroke-width="3" stroke-linecap="round" fill="none"/>

    <path d="M 136 68 Q 140 62 142 56" stroke="#2b1400" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 128 63 Q 129 55 131 48" stroke="#2b1400" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 118 63 Q 114 56 111 50" stroke="#2b1400" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Clock Center Pivot / Cute Nose -->
    <circle cx="100" cy="100" r="5" fill="#ffe8a1" stroke="#2b1400" stroke-width="2"/>

    <!-- Clock Hands (forming friendly expression) -->
    <!-- Hour Hand -->
    <line x1="100" y1="100" x2="68" y2="108" stroke="#ffe8a1" stroke-width="5" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="68" y2="108" stroke="#2b1400" stroke-width="2" stroke-linecap="round"/>
    <!-- Minute Hand pointing up-right -->
    <line x1="100" y1="100" x2="132" y2="72" stroke="#ffe8a1" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="132" y2="72" stroke="#2b1400" stroke-width="2" stroke-linecap="round"/>

    <!-- Wide Cheerful Retro Smile -->
    <path d="M 66 118 Q 100 156 134 118" fill="#781100" stroke="#2b1400" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Tongue -->
    <path d="M 84 135 Q 100 130 116 135 Q 100 155 84 135" fill="#ff7686"/>
    <!-- Cheeks Dimple Lines -->
    <path d="M 60 114 Q 63 120 67 122" stroke="#2b1400" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 140 114 Q 137 120 133 122" stroke="#2b1400" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Cartoon Legs -->
    <path d="M 80 172 Q 76 188 72 194" stroke="#2b1400" stroke-width="4" stroke-linecap="round" fill="none"/>
    <ellipse cx="66" cy="195" rx="10" ry="5" fill="#ffe8a1" stroke="#2b1400" stroke-width="2"/>
    <path d="M 120 172 Q 124 188 128 194" stroke="#2b1400" stroke-width="4" stroke-linecap="round" fill="none"/>
    <ellipse cx="134" cy="195" rx="10" ry="5" fill="#ffe8a1" stroke="#2b1400" stroke-width="2"/>

    <!-- Cartoon Arms waving -->
    <path d="M 28 100 Q 15 90 10 75" stroke="#2b1400" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Left Glove -->
    <ellipse cx="9" cy="72" rx="7" ry="7" fill="#ffffff" stroke="#2b1400" stroke-width="2"/>

    <path d="M 172 100 Q 185 85 190 70" stroke="#2b1400" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Right Glove Waving -->
    <ellipse cx="191" cy="67" rx="7" ry="7" fill="#ffffff" stroke="#2b1400" stroke-width="2"/>
  </g>
</svg>

