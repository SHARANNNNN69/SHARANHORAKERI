<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="chronoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1815"/>
      <stop offset="100%" stop-color="#070c0c"/>
    </linearGradient>
    <linearGradient id="emeraldGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#chronoGrad)"/>

  <!-- Sacred Timeline wavy multi-threads -->
  <path d="M 0 180 Q 150 90, 300 180 T 600 180" fill="none" stroke="url(#emeraldGold)" stroke-width="4"/>
  
  <!-- Branching Nexus timelines -->
  <path d="M 240 160 Q 320 80, 480 70 T 600 60" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 3"/>
  <path d="M 280 190 Q 360 270, 520 280 T 600 290" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 120 180 Q 200 230, 340 230" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-opacity="0.7"/>

  <!-- Nexus Event warning pulse -->
  <g transform="translate(480, 70)">
    <circle cx="0" cy="0" r="16" fill="#ef4444" opacity="0.25"/>
    <circle cx="0" cy="0" r="7" fill="#ef4444"/>
    <rect x="-65" y="-32" width="130" height="20" rx="10" fill="#180b0b" stroke="#ef4444" stroke-width="1"/>
    <text x="-56" y="-18" fill="#ef4444" font-family="'Courier New', monospace" font-size="9" font-weight="bold">NEXUS THRESHOLD</text>
  </g>

  <!-- Sacred Timeline Loom Node -->
  <g transform="translate(300, 180)">
    <circle cx="0" cy="0" r="22" fill="#10b981" opacity="0.2"/>
    <circle cx="0" cy="0" r="10" fill="#f59e0b"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>

  <!-- Tech HUD Details -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#6ee7b7">
    <text x="35" y="45">&gt; CHRONO_FLOW :: Multi-Agent Parallel Task Loom</text>
    <text x="35" y="325">STABILITY: 99.8% // AUTO_PRUNE_ANOMALIES = ENABLED</text>
  </g>
</svg>

