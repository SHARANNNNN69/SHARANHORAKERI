<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1424"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <radialGradient id="meshGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff7b00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgGrad1)"/>
  <circle cx="300" cy="180" r="160" fill="url(#meshGlow)"/>

  <!-- Neural Network & Web Graph -->
  <!-- Background Grid -->
  <g stroke="#1a2438" stroke-width="1" opacity="0.4">
    <line x1="0" y1="90" x2="600" y2="90"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="270" x2="600" y2="270"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
  </g>

  <!-- Connected Nodes (Spider-Web & Neural Brain Hybrid) -->
  <g stroke="#ff7b00" stroke-width="1.5" stroke-opacity="0.6">
    <line x1="300" y1="180" x2="210" y2="120"/>
    <line x1="300" y1="180" x2="390" y2="120"/>
    <line x1="300" y1="180" x2="220" y2="240"/>
    <line x1="300" y1="180" x2="380" y2="240"/>
    <line x1="210" y1="120" x2="140" y2="150"/>
    <line x1="390" y1="120" x2="460" y2="150"/>
    <line x1="220" y1="240" x2="140" y2="220"/>
    <line x1="380" y1="240" x2="460" y2="210"/>
    <line x1="210" y1="120" x2="300" y2="90"/>
    <line x1="390" y1="120" x2="300" y2="90"/>
    <line x1="220" y1="240" x2="300" y2="270"/>
    <line x1="380" y1="240" x2="300" y2="270"/>
  </g>

  <!-- Glowing Nodes -->
  <circle cx="300" cy="180" r="16" fill="#ff7b00" opacity="0.2"/>
  <circle cx="300" cy="180" r="8" fill="#ff7b00"/>
  <circle cx="300" cy="180" r="3" fill="#ffffff"/>

  <circle cx="210" cy="120" r="6" fill="#10b981"/>
  <circle cx="390" cy="120" r="6" fill="#00f5d4"/>
  <circle cx="220" cy="240" r="6" fill="#f59e0b"/>
  <circle cx="380" cy="240" r="6" fill="#ef4444"/>
  <circle cx="140" cy="150" r="5" fill="#38bdf8"/>
  <circle cx="460" cy="150" r="5" fill="#a855f7"/>
  <circle cx="140" cy="220" r="5" fill="#38bdf8"/>
  <circle cx="460" cy="210" r="5" fill="#a855f7"/>
  <circle cx="300" cy="90" r="5" fill="#f59e0b"/>
  <circle cx="300" cy="270" r="5" fill="#10b981"/>

  <!-- Code / Vector Matrix overlay -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#718096" opacity="0.8">
    <text x="35" y="45">&lt;NexusRAG::VectorStore dims="1536" /&gt;</text>
    <text x="35" y="325">query_similarity = cosine(q, corpus_embeddings) &gt; 0.94</text>
  </g>
  <g font-family="'Courier New', monospace" font-size="10" fill="#ff7b00">
    <rect x="420" y="30" width="145" height="24" rx="12" fill="#1b253b" stroke="#ff7b00" stroke-width="1"/>
    <text x="432" y="46">TVA LLM PIPELINE</text>
  </g>
</svg>

