<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <radialGradient id="spideySenseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgGrad2)"/>
  <circle cx="300" cy="180" r="150" fill="url(#spideySenseGlow)"/>

  <!-- Radar / Spidey-Sense concentric wave rings -->
  <circle cx="300" cy="180" r="40" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="300" cy="180" r="80" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.6"/>
  <circle cx="300" cy="180" r="120" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="8 4" stroke-opacity="0.5"/>
  <circle cx="300" cy="180" r="155" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Radar sweep line -->
  <line x1="300" y1="180" x2="420" y2="70" stroke="#00f5d4" stroke-width="2"/>
  <circle cx="420" cy="70" r="6" fill="#00f5d4"/>

  <!-- Computer Vision Bounding Boxes -->
  <rect x="220" y="100" width="160" height="170" rx="8" fill="none" stroke="#00f5d4" stroke-width="2" stroke-dasharray="6 4"/>
  <g fill="#00f5d4" font-family="'Courier New', monospace" font-size="10">
    <rect x="220" y="82" width="105" height="18" fill="#00f5d4" opacity="0.2"/>
    <text x="226" y="95">target: spider (0.98)</text>
  </g>

  <!-- Keypoint Pose skeleton -->
  <circle cx="300" cy="130" r="5" fill="#ef4444"/> <!-- head -->
  <circle cx="300" cy="165" r="4" fill="#ffffff"/> <!-- chest -->
  <circle cx="270" cy="180" r="4" fill="#00f5d4"/> <!-- left arm -->
  <circle cx="330" cy="180" r="4" fill="#00f5d4"/> <!-- right arm -->
  <circle cx="285" cy="235" r="4" fill="#ef4444"/> <!-- left leg -->
  <circle cx="315" cy="235" r="4" fill="#ef4444"/> <!-- right leg -->

  <line x1="300" y1="130" x2="300" y2="165" stroke="#ffffff" stroke-width="2"/>
  <line x1="300" y1="165" x2="270" y2="180" stroke="#00f5d4" stroke-width="2"/>
  <line x1="300" y1="165" x2="330" y2="180" stroke="#00f5d4" stroke-width="2"/>
  <line x1="300" y1="165" x2="285" y2="235" stroke="#ef4444" stroke-width="2"/>
  <line x1="300" y1="165" x2="315" y2="235" stroke="#ef4444" stroke-width="2"/>

  <!-- HUD Tag -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#94a3b8">
    <text x="35" y="45">SPIDER_VISION // FPS: 60 // YOLOv8 + OpenCV</text>
    <text x="35" y="325">SPIDEY_SENSE_ALERT: Threat level ZERO. Latency: 4.2ms</text>
  </g>
</svg>

