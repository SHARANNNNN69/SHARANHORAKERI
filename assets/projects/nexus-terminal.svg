<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141812"/>
      <stop offset="100%" stop-color="#080a08"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#termGrad)"/>
  
  <!-- Retro CRT Monitor Frame -->
  <rect x="25" y="25" width="550" height="310" rx="16" fill="#0d110d" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Terminal Top Bar -->
  <rect x="25" y="25" width="550" height="32" rx="16" fill="#1b211a"/>
  <circle cx="50" cy="41" r="5" fill="#ef4444"/>
  <circle cx="68" cy="41" r="5" fill="#f59e0b"/>
  <circle cx="86" cy="41" r="5" fill="#10b981"/>
  <text x="210" y="46" fill="#ff7b00" font-family="'Courier New', monospace" font-size="11" font-weight="bold">TVA_TERMINAL // SECURE_SHELL</text>

  <!-- Terminal Content Lines -->
  <g font-family="'Courier New', monospace" font-size="12" fill="#34d399">
    <text x="50" y="85"><tspan fill="#ff7b00">tva@multiverse:~$</tspan> status-check --variant "Sharan"</text>
    <text x="50" y="110"><tspan fill="#94a3b8">[INFO]</tspan> Loading Temporal Index... OK</text>
    <text x="50" y="135"><tspan fill="#94a3b8">[INFO]</tspan> Identity verified: 2nd Year CS AI Engineer</text>
    <text x="50" y="160"><tspan fill="#94a3b8">[INFO]</tspan> Status: Figuring out the world with Neural Nets</text>
    <text x="50" y="185"><tspan fill="#f59e0b">[ALERT]</tspan> Spidey-Sense detected 42 new pull requests</text>
    <text x="50" y="210"><tspan fill="#10b981">[SUCCESS]</tspan> All timeline tests passing (0 pruned, 100% canon)</text>
    <text x="50" y="245"><tspan fill="#ff7b00">tva@multiverse:~$</tspan> launch-neural-core --spidey-mode</text>
    <text x="50" y="275"><tspan fill="#38bdf8">&gt; Initializing Web-Shooter weights... [##########] 100%</tspan></text>
    <!-- Blinking Cursor -->
    <rect x="50" y="295" width="9" height="15" fill="#34d399">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

