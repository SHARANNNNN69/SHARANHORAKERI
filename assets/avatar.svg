<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2638"/>
      <stop offset="100%" stop-color="#0f1523"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="spideyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <!-- Ambient Portal Ring -->
  <circle cx="160" cy="160" r="140" fill="url(#portalGlow)"/>
  <circle cx="160" cy="160" r="130" fill="none" stroke="#2a3b5c" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="160" cy="160" r="120" fill="#0d121d" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Geometric Multiverse Grid lines in BG -->
  <line x1="80" y1="50" x2="240" y2="270" stroke="#1f2c42" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="240" y1="50" x2="80" y2="270" stroke="#1f2c42" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="160" y1="40" x2="160" y2="280" stroke="#ff7b00" stroke-width="1" stroke-dasharray="4 8" opacity="0.3"/>

  <!-- Character Silhouette & Hoodie -->
  <g>
    <!-- Shoulders / Hoodie Body -->
    <path d="M 75 290 C 85 220 120 200 160 200 C 200 200 235 220 245 290 Z" fill="url(#hoodieGrad)" stroke="#223048" stroke-width="2"/>
    
    <!-- Neon Hoodie Drawstrings / Spider web accents -->
    <line x1="145" y1="225" x2="140" y2="265" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="175" y1="225" x2="180" y2="265" stroke="#00f5d4" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Head / Neck -->
    <rect x="145" y="180" width="30" height="25" rx="5" fill="#c49774"/>
    <path d="M 125 150 C 125 95 195 95 195 150 C 195 185 125 185 125 150 Z" fill="#dfaa84"/>
    
    <!-- Modern Tech Hair -->
    <path d="M 120 135 C 120 85 150 70 190 80 C 200 95 200 125 195 135 C 190 110 170 100 150 102 C 135 104 125 115 120 135 Z" fill="#181c24"/>

    <!-- HUD / Futuristic Glasses (Loki Time-Scanner / Spider-HUD) -->
    <g>
      <!-- Glass Frame -->
      <path d="M 132 135 Q 160 130 188 135 L 184 150 Q 160 146 136 150 Z" fill="#0b1320" stroke="#f59e0b" stroke-width="1.8"/>
      <!-- Glowing Visor Glass -->
      <path d="M 134 137 Q 160 133 186 137 L 183 148 Q 160 144 137 148 Z" fill="url(#neonCyan)" opacity="0.85"/>
      <!-- Data scanline reflection -->
      <line x1="140" y1="142" x2="160" y2="142" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="178" cy="142" r="2" fill="#ef4444"/>
    </g>

    <!-- Earbuds / Comms Link -->
    <circle cx="123" cy="148" r="4" fill="#00f5d4"/>
    <circle cx="197" cy="148" r="4" fill="#ef4444"/>

    <!-- Subtle Spider Symbol on Chest in Glowing Orange/Red -->
    <path d="M 160 230 L 157 236 L 163 236 Z" fill="#ff7b00"/>
    <path d="M 152 232 Q 146 226 142 228" stroke="#ff7b00" stroke-width="1.5" fill="none"/>
    <path d="M 168 232 Q 174 226 178 228" stroke="#ff7b00" stroke-width="1.5" fill="none"/>
    <path d="M 153 237 Q 145 237 143 244" stroke="#ff7b00" stroke-width="1.5" fill="none"/>
    <path d="M 167 237 Q 175 237 177 244" stroke="#ff7b00" stroke-width="1.5" fill="none"/>
  </g>

  <!-- TVA Floating Tag -->
  <g transform="translate(195, 45)">
    <rect width="88" height="26" rx="13" fill="#131d2e" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="15" cy="13" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="17" fill="#fbbf24" font-family="'Courier New', monospace" font-size="10" font-weight="bold" letter-spacing="1">UNPRUNED</text>
  </g>
</svg>

